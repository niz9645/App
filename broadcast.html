<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Audio Broadcaster</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 40px; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        button { background: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
        button.stop { background: #dc3545; }
        .id-box { background: #e9ecef; padding: 10px; border-radius: 5px; font-weight: bold; margin-top: 15px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Restaurant Transmitter</h2>
        <div class="id-box" id="myPeerId">Initializing...</div>
        <button id="toggleBtn" onclick="toggleBroadcast()" disabled>Start Broadcasting</button>
        <p id="status" style="color: #666; margin-top: 15px;">Status: Initializing...</p>
    </div>

    <script>
        let peer;
        let localStream;
        const peerIdDiv = document.getElementById('myPeerId');
        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('status');

        const restaurantId = "my-restaurant-live-feed-12345";
        peer = new Peer(restaurantId);

        peer.on('open', (id) => {
            peerIdDiv.textContent = id;
            toggleBtn.disabled = false;
            statusText.textContent = "Status: Ready to broadcast";
        });

        peer.on('error', (err) => {
            statusText.textContent = "Error: " + err.type;
        });

        peer.on('call', (call) => {
            statusText.textContent = "Status: Connected (Streaming...)";
            call.answer(localStream);
        });

        async function toggleBroadcast() {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true }
                    });
                    toggleBtn.textContent = "Stop Broadcasting";
                    toggleBtn.classList.add('stop');
                    statusText.textContent = "Status: Broadcasting live...";
                } catch (err) {
                    alert("Microphone permission denied: " + err.message);
                }
            } else {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                toggleBtn.textContent = "Start Broadcasting";
                toggleBtn.classList.remove('stop');
                statusText.textContent = "Status: Stopped";
            }
        }
    </script>
</body>
</html>
