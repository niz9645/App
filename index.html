<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ഫൈവ് സ്റ്റാർ റെസ്റ്റോറന്റ് ബില്ലിംഗ്</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 5px; background: #f4f4f9; color: #333; }
        .container { max-width: 450px; margin: auto; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .nav-tabs button { flex: 1; padding: 8px; font-size: 13px; font-weight: bold; border: none; background: #ddd; cursor: pointer; border-radius: 4px; }
        .nav-tabs button.active { background: #007bff; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        h2 { text-align: center; color: #d9534f; margin: 5px 0 10px 0; font-size: 16px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #eee; font-size: 13px; }
        .btn { background: #28a745; color: white; border: none; padding: 10px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; text-align: center; margin-top: 10px; }
        .btn:active { background: #218838; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .menu-btn { background: #e9ecef; border: 1px solid #ced4da; padding: 8px; font-size: 12px; border-radius: 4px; cursor: pointer; text-align: left; }
        .menu-btn:active { background: #cbd3da; }

        /* Thermal Printer Styles (58mm width strict optimization) */
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .container { width: 58mm; max-width: 58mm; box-shadow: none; padding: 0; margin: 0; font-size: 11px; }
            .no-print { display: none !important; }
            h2 { font-size: 13px; }
            .item-row { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⭐ ഫൈവ് സ്റ്റാർ റെസ്റ്റോറന്റ്</h2>

    <!-- Navigation Tabs -->
    <div class="nav-tabs no-print">
        <button onclick="switchTab('billing')" id="tab-billing" class="active">ബിൽ</button>
        <button onclick="switchTab('menu')" id="tab-menu">മെനു</button>
        <button onclick="switchTab('expense')" id="tab-expense">ചെലവുകൾ</button>
        <button onclick="switchTab('report')" id="tab-report">റിപ്പോർട്ട്</button>
    </div>

    <!-- 1. BILLING SECTION -->
    <div id="section-billing" class="section active">
        <p style="text-align: center; font-size: 11px; margin: 2px 0;">തീയതി: <span id="current-date"></span></p>
        <hr style="border: 0.5px dashed #ccc;">

        <div style="font-weight: bold; font-size: 12px; margin-bottom: 5px;">മെനു ഐറ്റങ്ങൾ:</div>
        <div class="menu-grid no-print" id="billing-menu-list"></div>

        <div style="font-weight: bold; font-size: 12px; margin-top: 10px;">തിരഞ്ഞെടുത്തവ:</div>
        <div id="bill-items" style="min-height: 50px; max-height: 150px; overflow-y: auto; border: 1px solid #eee; padding: 5px; margin-bottom: 5px;"></div>

        <div style="font-weight: bold; display: flex; justify-content: space-between; font-size: 13px; margin-top: 5px;">
            <span>ആകെ തുക:</span>
            <span>₹<span id="grand-total">0</span></span>
        </div>
        <div style="font-size: 11px; margin-top: 4px;">
            പേയ്മെന്റ്: 
            <select id="payment-mode" style="width: auto; display: inline-block; padding: 2px;">
                <option value="UPI">യു.പി.ഐ (UPI)</option>
                <option value="Cash">കാഷ് (Cash)</option>
            </select>
        </div>

        <button class="btn no-print" onclick="saveAndPrint()">ബിൽ സേവ് ചെയ്ത് പ്രിന്റ് ചെയ്യുക</button>
    </div>

    <!-- 2. MENU EDIT SECTION -->
    <div id="section-menu" class="section no-print">
        <h3 style="font-size: 14px; color: #333;">പുതിയ മെനു ചേർക്കുക</h3>
        <input type="text" id="new-menu-name" placeholder="ഐറ്റത്തിന്റെ പേര് (ഉദാ: ചായ)">
        <input type="number" id="new-menu-price" placeholder="വില (₹)">
        <button class="btn" style="background: #007bff; margin-top: 5px;" onclick="addMenu()">മെനു സേവ് ചെയ്യുക</button>

        <h3 style="font-size: 14px; color: #333; margin-top: 15px;">നിലവിലുള്ള മെനു</h3>
        <div id="manage-menu-list" style="max-height: 200px; overflow-y: auto;"></div>
    </div>

    <!-- 3. EXPENSE SECTION -->
    <div id="section-expense" class="section no-print">
        <h3 style="font-size: 14px; color: #333;">ചെലവുകൾ രേഖപ്പെടുത്തുക</h3>
        <input type="text" id="expense-reason" placeholder="എന്തിനാണ് ചെലവ്? (ഉദാ: പച്ചക്കറി)">
        <input type="number" id="expense-amount" placeholder="തുക (₹)">
        <button class="btn" style="background: #d9534f; margin-top: 5px;" onclick="addExpense()">ചെലവ് സേവ് ചെയ്യുക</button>

        <div id="expense-history" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
    </div>

    <!-- 4. REPORT SECTION -->
    <div id="section-report" class="section no-print">
        <h3 style="font-size: 14px; color: #333;">ഇന്നത്തെ റിപ്പോർട്ട് (History)</h3>
        <div style="font-size: 13px; background: #e9ecef; padding: 8px; border-radius: 4px; margin-bottom: 8px;">
            ആകെ സെയിൽസ്: ₹<span id="report-total-sales">0</span><br>
            ആകെ ചെലവുകൾ: ₹<span id="report-total-expense">0</span>
        </div>
        <div id="sales-history-list" style="max-height: 200px; overflow-y: auto;"></div>
    </div>
</div>

<script>
    // LocalStorage Data Management (Zero Lag / Zero Error)
    let menus = JSON.parse(localStorage.getItem('restaurant_menus')) || [
        {name: 'ചിക്കൻ പൊറോട്ട', price: 110},
        {name: 'പൊറോട്ട', price: 15},
        {name: 'ചായ', price: 15},
        {name: 'നൊർമൽ കോഫി', price: 15},
        {name: 'ബോട്ടി', price: 70},
        {name: 'ബീഫ് എല്ല് കറി', price: 110}
    ];

    let currentBill = [];
    let salesHistory = JSON.parse(localStorage.getItem('restaurant_sales')) || [];
    let expenses = JSON.parse(localStorage.getItem('restaurant_expenses')) || [];

    // Tab Switching
    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
        document.getElementById('section-' + tabId).classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        if(tabId === 'report') updateReport();
    }

    // Date Update
    function updateDate() {
        const now = new Date();
        document.getElementById('current-date').innerText = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    updateDate();

    // Render Billing Menu Buttons
    function renderBillingMenu() {
        const list = document.getElementById('billing-menu-list');
        list.innerHTML = '';
        menus.forEach((item, index) => {
            list.innerHTML += `<button class="menu-btn" onclick="addToBill(${index})">${item.name} - ₹${item.price}</button>`;
        });
    }

    function addToBill(index) {
        const item = menus[index];
        const existing = currentBill.find(i => i.name === item.name);
        if (existing) {
            existing.qty += 1;
        } else {
            currentBill.push({name: item.name, price: item.price, qty: 1});
        }
        renderCurrentBill();
    }

    function renderCurrentBill() {
        const container = document.getElementById('bill-items');
        container.innerHTML = '';
        let total = 0;
        currentBill.forEach((item, index) => {
            total += item.price * item.qty;
            container.innerHTML += `
                <div class="item-row">
                    <span>${item.name} (x${item.qty})</span>
                    <span>₹${item.price * item.qty} 
                        <button onclick="removeFromBill(${index})" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold;">X</button>
                    </span>
                </div>`;
        });
        document.getElementById('grand-total').innerText = total;
    }

    function removeFromBill(index) {
        currentBill.splice(index, 1);
        renderCurrentBill();
    }

    // Save & Print Function (Zero Delay)
    function saveAndPrint() {
        if (currentBill.length === 0) {
            alert('ബില്ലിൽ ഐറ്റങ്ങൾ ഒന്നും ചേർത്തിട്ടില്ല!');
            return;
        }
        let total = currentBill.reduce((sum, i) => sum + (i.price * i.qty), 0);
        let paymentMode = document.getElementById('payment-mode').value;

        let saleItem = {
            date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            items: [...currentBill],
            total: total,
            mode: paymentMode
        };

        salesHistory.push(saleItem);
        localStorage.setItem('restaurant_sales', JSON.stringify(salesHistory));

        // Trigger Instant Print
        window.print();

        // Reset Bill
        currentBill = [];
        renderCurrentBill();
    }

    // Manage Menu
    function addMenu() {
        let name = document.getElementById('new-menu-name').value.trim();
        let price = parseFloat(document.getElementById('new-menu-price').value);
        if (!name || isNaN(price)) {
            alert('ശരിയായ വിവരങ്ങൾ നൽകുക!');
            return;
        }
        menus.push({name, price});
        localStorage.setItem('restaurant_menus', JSON.stringify(menus));
        document.getElementById('new-menu-name').value = '';
        document.getElementById('new-menu-price').value = '';
        renderBillingMenu();
        renderManageMenu();
    }

    function renderManageMenu() {
        let list = document.getElementById('manage-menu-list');
        list.innerHTML = '';
        menus.forEach((item, index) => {
            list.innerHTML += `<div class="item-row"><span>${item.name} - ₹${item.price}</span> <button onclick="deleteMenu(${index})" style="color:red; border:none; background:none; cursor:pointer;">ഡിലീറ്റ്</button></div>`;
        });
    }

    function deleteMenu(index) {
        menus.splice(index, 1);
        localStorage.setItem('restaurant_menus', JSON.stringify(menus));
        renderBillingMenu();
        renderManageMenu();
    }

    // Expenses
    function addExpense() {
        let reason = document.getElementById('expense-reason').value.trim();
        let amount = parseFloat(document.getElementById('expense-amount').value);
        if (!reason || isNaN(amount)) {
            alert('വിവരങ്ങൾ നൽകുക!');
            return;
        }
        expenses.push({reason, amount, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})});
        localStorage.setItem('restaurant_expenses', JSON.stringify(expenses));
        document.getElementById('expense-reason').value = '';
        document.getElementById('expense-amount').value = '';
        renderExpenses();
    }

    function renderExpenses() {
        let list = document.getElementById('expense-history');
        list.innerHTML = '<div style="font-weight:bold; font-size:12px; margin-bottom:4px;">ചെലവുകളുടെ പട്ടിക:</div>';
        expenses.forEach(e => {
            list.innerHTML += `<div class="item-row"><span>${e.reason} (${e.time})</span><span>₹${e.amount}</span></div>`;
        });
    }

    // Reports
    function updateReport() {
        let totalSales = salesHistory.reduce((sum, s) => sum + s.total, 0);
        let totalExpense = expenses.reduce((sum, e) => sum + e.amount, 0);

        document.getElementById('report-total-sales').innerText = totalSales;
        document.getElementById('report-total-expense').innerText = totalExpense;

        let list = document.getElementById('sales-history-list');
        list.innerHTML = '<div style="font-weight:bold; font-size:12px; margin-bottom:4px;">ഇന്നത്തെ ബില്ലുകൾ:</div>';
        salesHistory.slice().reverse().forEach(s => {
            let itemsStr = s.items.map(i => `${i.name}(x${i.qty})`).join(', ');
            list.innerHTML += `<div style="font-size:11px; border-bottom:1px solid #ddd; padding:4px 0;"><b>${s.date}</b> [${s.mode}]<br>${itemsStr} <br><b>ആകെ: ₹${s.total}</b></div>`;
        });
    }

    // Initial Load
    renderBillingMenu();
    renderManageMenu();
    renderExpenses();
</script>

</body>
</html>
